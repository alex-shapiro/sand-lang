[package]
name = "sandlang"
version = "0.1.0"
edition = "2024"
description = "Sand: a sandboxed, statically typed scripting language with a fast bytecode VM"
license = "MIT OR Apache-2.0"

[lib]
name = "sandlang"
path = "src/lib.rs"

[[bin]]
name = "sand"
path = "src/main.rs"

[features]
default = ["tls"]
tls = ["dep:rustls", "dep:tokio-rustls", "dep:webpki-roots"]

[dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time", "fs", "io-util", "io-std", "sync", "macros", "signal"] }
regex-automata = { version = "0.4.16", default-features = false, features = ["std", "syntax", "meta", "nfa-pikevm", "nfa-backtrack", "hybrid", "dfa-onepass", "perf-inline", "perf-literal", "unicode"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["ring", "tls12"] }
webpki-roots = { version = "1", optional = true }
unicode-normalization = "0.1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["fs", "std"] }

[target.'cfg(windows)'.dependencies]
fs_at = "0.2.1"
same-file = "1.0.6"

[dev-dependencies]
# Pseudo-terminals (Unix ptys, Windows ConPTY) for testing `--prompt`.
portable-pty = "0.9"
proptest = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time", "io-util", "macros"] }

[target.'cfg(windows)'.dev-dependencies]
junction = "2"

[[bench]]
name = "vm"
harness = false

[profile.release]
debug = 1
lto = "thin"
codegen-units = 4

[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 1
