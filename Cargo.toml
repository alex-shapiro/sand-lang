[workspace]
members = [".", "cli", "wasm"]
default-members = [".", "cli"]
resolver = "3"

[package]
name = "sandlang"
version = "0.1.0"
edition = "2024"
description = "Sand: a sandboxed, statically typed scripting language with a fast bytecode VM"
license = "MIT OR Apache-2.0"

[lib]
name = "sandlang"
path = "src/lib.rs"

[features]
default = ["os"]
# Access to the host operating system: its file system (otherwise the `fs`
# module and script imports use an in-memory file system, `MemFs`), network
# sockets (the `net` and `http` modules), the process's standard input and
# environment. Not available on wasm32-unknown-unknown.
os = ["dep:rustix", "dep:fs_at", "dep:same-file", "tokio/net", "tokio/io-std", "tokio/macros"]
# TLS for `https` and `net.connect_tls` (rustls with ring).
tls = ["os", "dep:rustls", "dep:tokio-rustls", "dep:webpki-roots"]

[dependencies]
tokio = { version = "1", features = ["rt", "sync", "io-util"] }
regex-automata = { version = "0.4.16", default-features = false, features = ["std", "syntax", "meta", "nfa-pikevm", "nfa-backtrack", "hybrid", "dfa-onepass", "perf-inline", "perf-literal", "unicode"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["ring", "tls12"] }
webpki-roots = { version = "1", optional = true }
unicode-normalization = "0.1"
sha2 = { version = "0.11", default-features = false }
sha1 = { version = "0.11", default-features = false }
md-5 = { version = "0.11", default-features = false }
hmac = { version = "0.13", default-features = false }
getrandom = "0.4"
hashbrown = { version = "0.16", default-features = false, features = ["inline-more"] }

# Everywhere but the web: timers come from tokio.
[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
tokio = { version = "1", features = ["time"] }

# The web (wasm32-unknown-unknown in a JavaScript host): the clock, timers
# and entropy come from JavaScript.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
web-time = "1.1"
js-sys = "0.3.105"
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4.78"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", optional = true, default-features = false, features = ["fs", "std", "time"] }

[target.'cfg(windows)'.dependencies]
fs_at = { version = "0.2.1", optional = true }
same-file = { version = "1.0.6", optional = true }

[dev-dependencies]
proptest = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time", "io-util", "macros"] }

[target.'cfg(windows)'.dev-dependencies]
junction = "2"

[[test]]
name = "examples"
required-features = ["os"]

[[test]]
name = "net_http"
required-features = ["os"]

[[test]]
name = "sandbox_io"
required-features = ["os"]

[[test]]
name = "tls"
required-features = ["os"]

[[bench]]
name = "vm"
harness = false

[[bench]]
name = "front"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = 1

[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 1

[profile.wasm-release]
inherits = "release"
lto = "fat"
codegen-units = 1
debug = 0
strip = true
