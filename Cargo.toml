[workspace]
members = [".", "cli", "macros", "wasm", "site"]
default-members = [".", "cli"]
resolver = "3"

[package]
name = "sandlang"
version = "0.1.0"
edition = "2024"
description = "A sandboxed, statically typed bytecode interpreter"
license = "AGPLv3"

[lib]
name = "sandlang"
path = "src/lib.rs"

[features]
default = ["os", "tls"]
os = ["dep:rustix", "dep:fs_at", "dep:same-file", "dep:winx", "dep:socket2", "tokio/net", "tokio/io-std", "tokio/macros", "jiff/tz-system"]
tls = ["os", "dep:rustls", "dep:tokio-rustls", "dep:webpki-roots"]

[dependencies]
sandlang-macros = { path = "macros" }
tokio = { version = "1", features = ["rt", "sync", "io-util"] }
regex-automata = { version = "0.4.16", default-features = false, features = ["std", "syntax", "meta", "nfa-pikevm", "nfa-backtrack", "hybrid", "dfa-onepass", "perf-inline", "perf-literal", "unicode"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["ring", "tls12"] }
webpki-roots = { version = "1", optional = true }
socket2 = { version = "0.6", optional = true }
unicode-normalization = "0.1"
sha2 = { version = "0.11", default-features = false }
sha1 = { version = "0.11", default-features = false }
md-5 = { version = "0.11", default-features = false }
hmac = { version = "0.13", default-features = false }
getrandom = "0.4"
hashbrown = { version = "0.16", default-features = false, features = ["inline-more"] }
indexmap = { version = "2", default-features = false, features = ["std"] }
compact_str = { version = "0.9", default-features = false }
jiff = { version = "0.2.38", default-features = false, features = ["std", "tzdb-bundle-always", "perf-inline"] }

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
tokio = { version = "1", features = ["time"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
web-time = "1.1"
js-sys = "0.3.105"
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4.78"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", optional = true, default-features = false, features = ["fs", "std", "time"] }

[target.'cfg(windows)'.dependencies]
fs_at = { version = "0.2.1", optional = true }
same-file = { version = "1.0.6", optional = true }
winx = { version = "0.36", optional = true }

[dev-dependencies]
proptest = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time", "io-util", "macros"] }

[target.'cfg(windows)'.dev-dependencies]
junction = "2"

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.29", default-features = false, features = ["resource"] }

[[test]]
name = "examples"
required-features = ["os"]

[[test]]
name = "net_http"
required-features = ["os"]

[[test]]
name = "sandbox_io"
required-features = ["os"]

[[test]]
name = "resources"
required-features = ["os"]

[[test]]
name = "tls"
required-features = ["os"]

[[bench]]
name = "vm"
harness = false

[[bench]]
name = "front"
harness = false

[[bench]]
name = "policy"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = 1

[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 1

[profile.wasm-release]
inherits = "release"
lto = "fat"
codegen-units = 1
debug = 0
strip = true
