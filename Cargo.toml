[workspace]
resolver = "3"
members = ["crates/sandlang", "crates/sandlang-macros", "crates/sand-cli", "crates/sandlang-wasm", "crates/sandlang-site"]
default-members = ["crates/sandlang", "crates/sandlang-macros", "crates/sand-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPLv3"

[workspace.dependencies]
sandlang = { path = "crates/sandlang", default-features = false }
sandlang-macros = { path = "crates/sandlang-macros" }
compact_str = { version = "0.9", default-features = false }
fs_at = "0.2.1"
getrandom = "0.4"
hashbrown = { version = "0.16", default-features = false }
hmac = { version = "0.13", default-features = false }
indexmap = { version = "2", default-features = false }
itoa = "1"
jiff = { version = "0.2.38", default-features = false }
js-sys = "0.3.105"
junction = "2"
md-5 = { version = "0.11", default-features = false }
nix = { version = "0.29", default-features = false }
nu-ansi-term = "0.50"
parking_lot = "0.12"
portable-pty = "0.9"
proc-macro2 = "1"
proptest = "1"
pulldown-cmark = { version = "0.13", default-features = false }
quote = "1"
reedline = "0.51"
regex-automata = { version = "0.4.16", default-features = false }
rustix = { version = "1.1.5", default-features = false }
rustls = { version = "0.23", default-features = false }
same-file = "1.0.6"
sha1 = { version = "0.11", default-features = false }
sha2 = { version = "0.11", default-features = false }
smallvec = "1"
socket2 = "0.6"
syn = "2"
tokio = { version = "1", default-features = false }
tokio-rustls = { version = "0.26", default-features = false }
unicode-normalization = "0.1"
url = "2"
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4.78"
web-time = "1.1"
webpki-roots = "1"
winx = "0.36"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = 1

[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 1

[profile.wasm-release]
inherits = "release"
lto = "fat"
codegen-units = 1
debug = 0
strip = true
