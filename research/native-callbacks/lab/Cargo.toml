[package]
name = "callback-lab"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
mlua = { version = "0.11", features = ["lua54", "vendored", "async", "send"] }
wasmtime = { version = "*", default-features = false, features = ["cranelift", "runtime", "async", "wat", "component-model", "std"] }
wasmi = "*"
wat = "*"
piccolo = "*"
gc-arena = "0.5"
rhai = { version = "*", features = ["sync"] }
rune = "*"
starlark = "0.14"
starlark_derive = "0.14"
rquickjs = "*"
tokio = { version = "1", features = ["rt", "macros", "time", "rt-multi-thread"] }
futures = "0.3"
anyhow = "1"

[profile.release]
debug = false
